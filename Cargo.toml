[package]
name = "proxy"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "proxy"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["net", "rt-multi-thread", "macros", "time"] }
hyper = { version = "0.14", features = ["http1", "http2", "client", "server", "tcp"] }
hyper-rustls = { version = "0.24", features = ["webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.0", features = ["derive"] }
url = "2.0"
bytes = "1.0"